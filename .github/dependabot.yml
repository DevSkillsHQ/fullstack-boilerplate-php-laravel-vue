# Grouped, weekly updates (QOHA-3756). Majors of packages that only work together arrive
# as one PR per family; every minor and patch update of a directory arrives as one PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      vue:
        patterns:
          - "vue"
          - "@vue/*"
          - "vue-router"
          - "vue-tsc"
        update-types:
          - "major"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "composer"
    directory: "/app-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "illuminate/*"
          - "symfony/*"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
